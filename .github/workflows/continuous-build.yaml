name:  Continuous Build / Unit Test

on:
  push:
    paths-ignore:
    - documentation/**

env:
  rg:  gram-parser

jobs:
  build-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET Core
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.x
    # See https://docs.microsoft.com/en-us/dotnet/core/tools/dotnet-restore
    - name: Install dependencies
      run: dotnet restore code
    # See https://docs.microsoft.com/en-us/dotnet/core/tools/dotnet-build
    - name: Build
      run: dotnet build code --configuration Release --no-restore
    - name: Unit Tests
      run: |
        dotnet test code/KustoCopyTest --configuration Release \
          --no-build --verbosity normal
