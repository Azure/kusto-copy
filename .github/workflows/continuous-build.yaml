name:  Continuous Build / Unit Test

on:
  push:
    paths-ignore:
    - documentation/**

env:
  rg:  gram-parser

jobs:
  build-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
    - name: Setup .NET Core
      uses: actions/setup-dotnet@871f041373faaad213a635d9afb62905ec029bbb # v1.10.1
      with:
        dotnet-version: 10.x
    # See https://docs.microsoft.com/en-us/dotnet/core/tools/dotnet-restore
    - name: Install dependencies
      run: dotnet restore code
    # See https://docs.microsoft.com/en-us/dotnet/core/tools/dotnet-build
    - name: Build
      run: dotnet build code --configuration Release --no-restore
    - name: Unit Tests
      run: |
        dotnet test code/KustoCopyTest --configuration Release \
          --no-build --verbosity normal
